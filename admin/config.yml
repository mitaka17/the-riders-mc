backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "settings"
    label: "Настройки и Съдържание на сайта"
    files:
      - file: "data/site-data.json"
        label: "Всички секции на сайта"
        name: "site_data"
        fields:
          - label: "Информация за клуба и Банкова сметка"
            name: "club_info"
            widget: "object"
            fields:
              - {label: "Име на клуба", name: "name", widget: "string"}
              - {label: "Мото", name: "motto", widget: "string"}
              - {label: "Дата на основаване", name: "founded", widget: "string"}
              - {label: "Град", name: "city", widget: "string"}
              - {label: "Адрес на клубната къща", name: "address", widget: "string"}
              - {label: "Текст За клуба", name: "about_text", widget: "text"}
              - {label: "Телефон", name: "phone", widget: "string"}
              - {label: "Имейл", name: "email", widget: "string"}
              - {label: "Facebook линк", name: "facebook", widget: "string"}
              - {label: "Име на банката", name: "bank_name", widget: "string"}
              - {label: "IBAN сметка", name: "iban", widget: "string"}
              - {label: "Основание за дарение", name: "donation_reason", widget: "string"}
          - label: "Начален слайдър (Фонови снимки)"
            name: "slides"
            widget: "list"
            fields:
              - {label: "Фонова снимка", name: "image", widget: "image"}
              - {label: "Малък надпис (Мото)", name: "motto", widget: "string"}
              - {label: "Голямо заглавие", name: "title", widget: "string"}
              - {label: "Подзаглавие", name: "subtitle", widget: "string"}
          - label: "Събития"
            name: "events"
            widget: "list"
            fields:
              - {label: "Дата", name: "date", widget: "string"}
              - {label: "Заглавие на събитието", name: "title", widget: "string"}
              - {label: "Място", name: "location", widget: "string"}
              - {label: "Описание", name: "description", widget: "text"}
          - label: "Галерия със снимки"
            name: "gallery"
            widget: "list"
            fields:
              - {label: "Снимка", name: "image", widget: "image"}
              - {label: "Описание на снимката", name: "caption", widget: "string"}
          - label: "Фен Шоп (Артикули)"
            name: "shop"
            widget: "list"
            fields:
              - {label: "Име на артикула", name: "name", widget: "string"}
              - {label: "Цена", name: "price", widget: "string"}
              - {label: "Описание / Размери", name: "description", widget: "string"}
              - {label: "Снимка на артикула", name: "image", widget: "image"}
